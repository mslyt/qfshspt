<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临床常用药医嘱速查表</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1b2430; --ink2:#5b6879; --line:#e3e8f0;
  --pri:#1f5fa8; --pri-soft:#eaf1fb; --warn:#c0392b; --warn-soft:#fdecea;
  --ok:#1e7d5a; --ok-soft:#e7f6ef; --shadow:0 2px 10px rgba(27,36,48,.07);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","WenQuanYi Micro Hei",-apple-system,sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

/* ── 头部 ── */
header{background:linear-gradient(135deg,#1f5fa8,#2b7fc4);color:#fff;border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);}
header h1{margin:0 0 6px;font-size:24px;letter-spacing:1px;}
header p{margin:0;font-size:13px;opacity:.9;}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.stat{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 14px;font-size:13px;}

/* ── 工具栏 ── */
.toolbar{position:sticky;top:0;z-index:50;background:rgba(244,246,250,.92);backdrop-filter:blur(6px);
  padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line);}
#q{order:0;flex:1 1 220px;min-width:180px;padding:9px 14px;border:1px solid var(--line);border-radius:22px;font-size:15px;outline:none;background:#fff;}
#q:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft);}
.chips{display:flex;flex-wrap:wrap;gap:8px;width:100%;}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:18px;padding:5px 14px;
  font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap;}
.chip:hover{border-color:var(--pri);color:var(--pri);}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700;}
#clearAll{margin-left:auto;background:none;border:none;color:var(--warn);font-size:13px;cursor:pointer;text-decoration:underline;}

/* ── 分类块 ── */
section{margin-top:24px;}
.cat-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin:0 0 12px;padding-left:10px;border-left:5px solid var(--pri);}
.cat-title .n{font-size:13px;font-weight:400;color:var(--ink2);background:var(--pri-soft);border-radius:12px;padding:1px 10px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:11px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow);
 box-sizing:border-box;break-inside:avoid;display:flex;flex-direction:column;gap:5px;}
.card>*{margin:0;}
.card ul{padding:0;list-style:none;}
.card li{padding:0;}
.card .top{display:flex;align-items:flex-start;gap:7px;}
.card h3{margin:0;font-size:14.6px;font-weight:700;line-height:1.45;flex:1 1 auto;word-break:break-all;}
.idx{font-size:11.5px;color:#9aa5b4;font-weight:400;flex:0 0 auto;}
.route{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;flex:0 0 auto;}
.r-iv{background:#e8f0fc;color:#1f5fa8;}
.r-po{background:#e9f7ee;color:#1e7d5a;}
.r-im{background:#fdf0e0;color:#a9710a;}
.r-inh{background:#f1e9fa;color:#7a4bb5;}
.r-skin{background:#fde8ef;color:#b03a5b;}
.r-pump{background:#dff2f4;color:#0e7c86;}
.body{font-size:13.6px;line-height:1.6;}
.dose{color:var(--pri);font-weight:700;}
.freq{color:var(--ok);font-weight:700;}
.mix{color:var(--ink2);}
.note{display:block;margin-top:2px;color:var(--warn);font-size:12.3px;font-weight:700;line-height:1.5;}
.card.hide{display:none;}

/* ── 通用警示 ── */
.notice{margin-top:24px;background:var(--warn-soft);border:1px solid #f5c6cb;border-radius:12px;padding:14px 18px;font-size:13px;color:#8a2a20;}
.notice b{font-size:14px;}
.notice ol{margin:8px 0 0;padding-left:20px;}
footer{margin-top:26px;text-align:center;color:var(--ink2);font-size:12.5px;}

/* ── 搜索高亮 ── */
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px;}
.hide{display:none !important;}
@media(max-width:560px){
  header h1{font-size:20px;}
  .cards{grid-template-columns:1fr;}
  .chip{padding:5px 11px;font-size:13px;}
}
@media print{
  body{background:#fff;font-size:11pt;}
  .toolbar,.stats{display:none;}
  .card{box-shadow:none;break-inside:avoid;}
  section{page-break-inside:avoid;}
}
</style>
</head>

</div>

  {n:"蔗糖铁",d:"0.1 g",f:"qod",r:"iv",way:"iv.drip",mix:"NS 100 ml",t:"qod 隔日，试验剂量后给药"}
 ]},
 {cat:"降尿酸",items:[
  {n:"碳酸氢钠片",d:"0.5 g",f:"tid",r:"po",way:"P.O.",mix:"",t:"碱化尿液"},
  {n:"非布司他片",d:"20 mg",f:"qd",r:"po",way:"P.O.",mix:"",t:"监测肝肾功能"}
 ]},
 {cat:"其他",items:[
  {n:"硫辛酸",d:"0.6 g",f:"qd",r:"iv",way:"iv.drip",mix:"NS 250 ml",t:""},
  {n:"荆防颗粒",d:"1 袋",f:"tid",r:"po",way:"po",mix:"",t:"感冒"},
  {n:"西酞普兰片（抗焦虑）",d:"20 mg",f:"qd",r:"po",way:"P.O.",mix:"",t:"注意 QT 延长与出血风险"}
 ]},
 {cat:"青霉素皮试",items:[
  {n:"注射用青霉素钠（皮试液）",d:"80 万 u",f:"—",r:"skin",way:"皮试",mix:"NS 10 ml",t:"皮试配置，取 0.1 ml 皮内注射"}
 ]},
 {cat:"泻药 · 肠道准备",items:[
  {n:"西甲硅油乳剂 ＋ 复方聚乙二醇电解质散",d:"2 ml ＋ 4 袋",f:"—",r:"po",way:"po",mix:"加水配服",t:"肠道准备／腹胀排气"}
 ]}
];

const ROUTE_NAME={iv:"静脉滴注/推注",po:"口服",im:"肌注",inh:"雾化吸入",skin:"皮试",pump:"静脉泵入"};
let total=0, flat=[];
DATA.forEach((g,gi)=>g.items.forEach((it,i)=>{it.cat=g.cat;it.id=gi+'-'+i;flat.push(it);total++;}));

/* ── 分类筛选按钮（按医嘱条数排序） */
const order=DATA.slice().sort((a,b)=>b.items.length-a.items.length);
const chips=document.getElementById('chips');
let act=new Set();
function renderChips(){
  chips.innerHTML='<span class="chip'+(act.size?'':' on')+'" data-c="ALL">全部</span>'+
  order.map(g=>'<span class="chip'+(act.has(g.cat)?' on':'')+'" data-c="'+g.cat+'">'+g.cat+
  ' <b style="opacity:.6;font-weight:400">'+g.items.length+'</b></span>').join('');
}
chips.onclick=e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const v=c.dataset.c;
  if(v==='ALL'){act.clear();}else{act.has(v)?act.delete(v):act.add(v);}
  if(act.size>3) act=new Set([v]);
  renderChips(); apply();
};

/* ── 渲染 ── */
const list=document.getElementById('list');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,kw){return kw?esc(s).replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'):esc(s);}
function render(){
  let html='';
  DATA.forEach(g=>{
    let cards='';
    g.items.forEach((it,i)=>{
      cards+='<div class="card">'+
        '<div class="top"><h3><span class="idx">'+String(i+1).padStart(2,'0')+'</span>'+hl(it.n,'')+'</h3>'+
        '<span class="route r-'+it.r+'">'+ROUTE_NAME[it.r]+'</span></div>'+
        '<div class="body"><span class="dose">'+hl(it.d,'')+'</span>'+(it.f!=='—'?'　<span class="freq">'+it.f+'</span>':'')+
        '<br><span class="mix">'+(it.mix?hl(it.mix,'')+'　':'')+it.way+'</span>'+(it.t?'<span class="note">⚑ '+it.t+'</span>':'')+
        '</div></div>';
    });
    html+='<section data-cat="'+g.cat+'"><h2 class="cat-title">'+g.cat+' <span class="n">'+g.items.length+' 条</span></h2><div class="cards">'+cards+'</div></section>';
  });
  list.innerHTML=html;
}
render(); renderChips();

/* ── 搜索 + 筛选 ── */
const q=document.getElementById('q');
function apply(){
  let n=0;
  const kw=q.value.trim();
  document.querySelectorAll('#list section').forEach(sec=>{
    const cat=sec.dataset.cat;
    let vis=0;
    if(act.size && !act.has(cat)){sec.classList.add('hide');return;}
    sec.classList.remove('hide');
    sec.querySelectorAll('.card').forEach(c=>{
      const ok=!kw||c.textContent.toLowerCase().includes(kw.toLowerCase());
      c.classList.toggle('hide',!ok); if(ok)vis++;
    });
    if(!vis){sec.classList.add('hide');} else {n+=vis;}
  });
  document.getElementById('match').textContent='匹配 '+n+' 条';
}
q.addEventListener('input',apply);
document.getElementById('clearAll').onclick=()=>{q.value='';act.clear();renderChips();apply();};
document.getElementById('hideNote').onclick=()=>{
  const n=document.getElementById('nt'); n.style.display='none';
  try{localStorage.setItem('hideNote','1');}catch(e){}
};
if(localStorage.getItem('hideNote')==='1') document.getElementById('nt').style.display='none';</script>
</body>
</html>
